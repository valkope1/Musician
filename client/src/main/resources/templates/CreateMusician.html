<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MUSICIANS</title>
</head>
<body>
<nav>
    <a href="/">HOME</a>
    <a href="/musicians">Musicians management</a>
    <a href="/bands">Bands management</a>
    <a href="/musicalevents">Musical events management</a>
</nav>
<main>
    <h1>MUSICIAN CREATE</h1>
    <form action="/musicians/create" method="post">
        <label for="musicianId">Id:</label>
        <input type="hidden" id="musicianId" name="musicianId" value="0"/>

        <br/>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <br/>

        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname" required/>

        <br/>

        <label for="instrument">Instrument:</label>
        <input type="text" id="instrument" name="instrument" required/>

        <br/>

        <label for="birthDate">Birthdate:</label>
        <input type="date" id="birthDate" name="birthDate" required/>

        <br/>
        <select id="bandId" name="bandId" th:required="true">
            <option value="">Band id</option>
            <option th:each="option : ${bandsId}" th:value="${option}" th:text="${option}"></option>
        </select>
        <br/>

        <button type="submit">Create musician</button>
    </form>
</main>

</body>
</html>
